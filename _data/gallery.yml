# ---------------------------------------------------------------------------
# Photo Gallery content
# ---------------------------------------------------------------------------
# Every entry below is clearly-labelled placeholder artwork, not a photograph
# of the college, the batch or any identifiable student. Replace the files in
# assets/img/ and update the captions (or delete the entries) once authentic,
# consent-checked photographs are supplied.
#
# Required fields:  image, alt
# Optional fields:  caption, date, event, credit
#   alt     — accessible description of the image (never leave empty)
#   caption — short visible caption, English-first, Bengali allowed
#   lang    — "en" (default) or "bn" when the caption is Bengali
# ---------------------------------------------------------------------------
